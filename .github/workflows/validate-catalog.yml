name: Validate Piston catalog
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install PyYAML python-liquid markdown
      - name: Generate and validate catalog
        run: |
          python tools/genera_pagine.py
          python tools/valida.py
          git diff --exit-code -- _motori/
      - name: Reject newly added engines without complete EN FR CS translations
        run: python tools/verifica_traduzioni.py --new-only
      - name: Render preview
        run: python tools/anteprima.py
