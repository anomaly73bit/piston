name: Validate Piston catalog
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: YAML, engine pages and site preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --disable-pip-version-check pyyaml python-liquid markdown
      - name: Check generated pages
        run: |
          python tools/genera_pagine.py
          git diff --exit-code -- _motori en/motori fr/motori cs/motori
      - name: Validate engine catalog
        run: python tools/valida.py
      - name: Translations built from reviewed files (report only)
        run: |
          python tools/traduci.py
          git diff --exit-code -- _data/traduzioni/en.json _data/traduzioni/fr.json _data/traduzioni/cs.json
          python tools/verifica_traduzioni.py
      - name: Render complete preview
        run: python tools/anteprima.py
