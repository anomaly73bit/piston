title: Piston
tagline: Enciclopedia dei motori d'automobile di ogni epoca
description: >-
  Schede tecniche, versioni, auto, storia, punti deboli e limiti di tuning
  dei motori d'automobile costruiti di ogni epoca.
lang: it

# Dominio personalizzato (file CNAME)
url: "https://piston.pacificit.solutions"
baseurl: ""

collections:
  motori:
    output: true
    permalink: /motori/:name/

defaults:
  - scope:
      path: ""
      type: motori
    values:
      layout: motore

markdown: kramdown
exclude:
  - tools/
  - README.md
  - Gemfile
  - Gemfile.lock
  - _anteprima/
