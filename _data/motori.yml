    Birotore con i primi turbo sequenziali di grande serie, il 13B-REW unisce leggerezza, ingombri minimi e una
    progressione impressionante. Il "cilindri: 2" indica qui i due rotori: la cilindrata è quella di una camera per rotore (2 x 654 cc).
  punti_deboli:
    - "Tenute d'apice e laterali: la compressione va misurata prima dell'acquisto"
    - Il groviglio di tubi del vuoto del sistema sequenziale ('rat's nest')
    - "Surriscaldamento: radiatore e sensori vanno tenuti in perfetto stato"
  limiti: >-
    Con turbo singolo e gestione corretta si arriva a 400 CV mantenendo affidabilità ragionevole; oltre servono tenute e luci modificate.
  curiosita:
    - Un motore rotativo (il 26B a quattro rotori) ha vinto Le Mans nel 1991 con la Mazda 787B.

