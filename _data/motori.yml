    Versione da 2,3 litri del quattro cilindri Saab serie H, ottenuta portando la corsa a 90 mm, con blocco in ghisa,
    testata a sedici valvole e alberi di equilibratura controrotanti nel basamento. Il B234 equipaggia la 9000 dal 1990
    al 1998, con il B234R della 9000 Aero come versione di punta; dal 1993 la gestione è affidata al sistema Trionic.
    Il B235 del 1998, alleggerito e con gestione Trionic 7 a controllo di coppia, monta turbo a bassa pressione sulle
    2.3t e il Mitsubishi TD04HL sulle Aero, e resta in produzione fino alla fine della prima 9-5 nel 2009.
