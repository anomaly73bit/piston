    - { nome: "Toyota Supra (A80)", anni: "1993–2002" }
    - { nome: "Toyota Aristo / Lexus GS (S140, S160)", anni: "1991–2004" }
  storia: >-
    Sviluppato dal 1JZ con corsa allungata da 71,5 a 86 mm, debutta nel 1991 sulla Toyota Aristo e dal 1993
    equipaggia la Supra A80. Basamento in ghisa a sette supporti di banco, albero motore in acciaio forgiato,
    bielle forgiate e pistoni con getti d'olio sotto il cielo. Sovralimentazione a due turbo in configurazione
    sequenziale con intercooler aria-aria. Dal 1997 adotta la fasatura variabile VVT-i sull'albero di aspirazione.
  punti_deboli:
    - Turbine sequenziali originali con tenute delicate dopo molti anni
    - Valvole di controllo del sistema sequenziale (tubazioni vuoto) soggette a guasti
    - Cinghia di distribuzione da sostituire regolarmente (motore non interferente sulle prime versioni)
  limiti: >-
    Basamento e albero motore di serie sopportano oltre 700 CV. Le bielle originali sono il primo componente
    critico, indicativamente tra 700 e 800 CV. Con bielle e pistoni forgiati il basamento di serie supera i 1000
    CV.
  curiosita:
    - "La versione VVT-i del 1997 aumenta la coppia ai regimi medi a parità di potenza dichiarata."
    - "Il sistema sequenziale fa lavorare il primo turbo da solo fino a circa 4000 giri/min, poi apre il secondo."

