    dentata con catena semplice; con la S4 B6 la distribuzione passa a catene sul lato cambio. La versione biturbo della RS6 C5 è stata
    sviluppata con Cosworth Technology. In Audi è sostituito dal 4.2 FSI a iniezione diretta dal 2005; nella Volkswagen Phaeton resta
    in listino fino al 2016.
  punti_deboli:
    - "Catene di distribuzione posteriori (S4 B6/B7): usura di tenditori, guide e variatori di fase anche da 60.000 km; tenditori e guide si sostituiscono solo con motore smontato"
    - "Turbocompressori della RS6 C5: guasti ricorrenti; sono montati tra motore e paratia e la sostituzione richiede la rimozione del motore"
  limiti: >-
    Le versioni aspirate guadagnano poco con la sola centralina. Il biturbo della RS6 C5 regge indicativamente oltre 550 CV; il
    componente critico è il cambio automatico a cinque rapporti ZF 5HP24A, per proteggere il quale Audi ha limitato la potenza di serie.
  curiosita:
    - "Cosworth Technology ha costruito anche il motore della versione da competizione della RS6 per la SPEED World Challenge."

