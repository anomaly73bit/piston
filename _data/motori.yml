    adotta albero forgiato, collettore di aspirazione a lunghezza variabile, collettori di scarico in acciaio inox e Motronic;
    dal 1992 l'S38B38 sale a 3795 cc. Non ha avuto un successore diretto: la M5 E39 del 1998 è passata al V8 S62.
  punti_deboli:
    - "Pattini e tenditore della catena di distribuzione usurati ad alto chilometraggio"
    - "Gioco valvole a spessori da controllare periodicamente; trascurarlo causa funzionamento irregolare"
    - "Sei farfalle da sincronizzare: senza registrazione il minimo diventa irregolare"
    - "Perdite d'olio da coperchio punterie, coppa e paraoli di banco; tubi del vuoto deteriorati"
  limiti: >-
    Non risultano soglie di elaborazione documentate da fonti affidabili; la massima potenza di serie è di 340 CV a 6900
    giri/min sull'S38B38. Il componente critico è la distribuzione a catena duplex con punterie a spessori. Il limitatore
    indicato è un valore prudente vicino al regime di potenza massima.
  curiosita:
    - "Della M5 E34 sono stati costruiti 8344 esemplari con il 3,6 litri e 3910 con il 3,8 litri."

