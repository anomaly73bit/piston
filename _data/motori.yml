    Ford di Bridgend fino al 2020 e poi da JLR a Wolverhampton. Basamento in alluminio pressofuso progettato per canne
    Nikasil, sostituite con canne in ghisa dopo i guasti legati ai carburanti ad alto tenore di zolfo. Il 5.0 AJ133 del 2009
    adotta iniezione diretta, quattro variatori di fase azionati dalle coppie dell'albero a camme e, sulla versione aspirata,
