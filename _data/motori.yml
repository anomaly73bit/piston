    - "1KD-FTV Euro IV: crepe nei pistoni, riconosciute da Toyota con il bollettino EG-008T-0112 del 2014"
    - "1KD-FTV: guasti agli iniettori, spesso tra 120.000 e 140.000 km"
    - "1GD-FTV: rigenerazione incompleta del filtro antiparticolato con intasamento (codice P2463), oggetto di aggiornamenti software e di un'azione collettiva in Australia"
    - "1GD-FTV: depositi sugli ugelli degli iniettori e crepe interne nel radiatore EGR"
  limiti: >-
    Sul 1KD-FTV la modifica della centralina è sconsigliata per il rischio di crepe nei pistoni. Il 1GD-FTV raggiunge
    di serie 224 CV e 550 Nm su basamento in ghisa; aumenti ulteriori sollecitano frizione, cambio manuale (limitato a
