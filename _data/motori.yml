    Progettato per vincere nel Gruppo A, l'RB26 ha una cilindrata di 2,6 litri scelta per rientrare nella classe di peso
    più favorevole con il coefficiente turbo. Con la R32 GT-R dominò il campionato giapponese turismo vincendo tutte le gare
    a cui partecipò, guadagnandosi il soprannome di "Godzilla".
  punti_deboli:
    - Collare di trascinamento della pompa olio, che si rompe soprattutto con limitatori alzati
