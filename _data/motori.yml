    alluminio e venti valvole. Il primo turbo è il 2,3 litri (81 x 90 mm) dell'850 T5 per il model year 1994; dal 2003 la
    cilindrata principale passa a 2521 cc con corsa di 93,2 mm, e l'ultima evoluzione B5254T12 da 2497 cc resta in
    listino sulle T5 fino al 2016. Ford lo usa come Duratec ST e Duratec RS sulla Focus di
