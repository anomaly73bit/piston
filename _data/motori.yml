    presentato al Salone di Francoforte del 2005 e montato dalla Golf GT TSI. Un compressore volumetrico Roots Eaton
    azionato a cinghia tramite frizione magnetica lavora ai bassi regimi in serie al turbocompressore KKK, che prende il
