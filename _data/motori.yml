    basamento ad alesaggio 94 mm con canne inserite: oltre le potenze di serie le elaborazioni richiedono canne con battuta
    superiore o basamenti rinforzati; non ci sono soglie documentate affidabili.
  curiosita:
    - "Land Rover sottoponeva i basamenti a controllo a ultrasuoni per destinare quelli migliori alle versioni più potenti, senza modificare il processo di fusione."
    - "La Rover SD1 Vitesse del 1982 aveva una zona rossa del contagiri a 5500 giri/min."

