    Sei cilindri in linea con basamento e testa in alluminio, debutto nel 1983 sulla XJ-S 3.6 e poi sulla berlina XJ40 dal 1986.
    Tutte le cilindrate condividono l'alesaggio di 91 mm: 2,9 litri monoalbero a 12 valvole (167 CV), 3,2, 3,6 e 4,0 litri
    bialbero a 24 valvole. L'evoluzione AJ16 del 1994 per la XJ X300 introduce accensione elettronica senza distributore,
