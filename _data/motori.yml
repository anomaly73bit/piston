    - "Tubi di raccordo del liquido di raffreddamento in plastica, sostituiti con elementi in alluminio sulle ultime versioni"
  limiti: >-
    Mancano soglie documentate da fonti tecniche affidabili. Di fabbrica il 5.0 compressore arriva a 600 CV sulla XE SV Project 8
    con lo stesso basamento open-deck delle versioni da 510 CV; oltre, il limite indicativo è dato dalla capacità del compressore
    e dalla trasmissione.
  curiosita:
