    Progettato per l'omologazione Gruppo A: la cilindrata di 2568 cc, moltiplicata per il coefficiente turbo 1,7,
    colloca la vettura nella classe fino a 4,5 litri. Basamento in ghisa, testata in alluminio bialbero a 24
