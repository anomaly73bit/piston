    V6 a 90° derivato da quello della Merak, presentato nel dicembre 1981 sulla Biturbo con due piccoli turbocompressori
    IHI, prima soluzione biturbo su un'auto di serie. Nasce con tre valvole per cilindro, un albero a camme per bancata
    e distribuzione a cinghia; seguono turbine raffreddate ad acqua e intercooler (1985), iniezione elettronica (1986)
