    le versioni F90 superano indicativamente i 700 CV; oltre diventano critici turbocompressori di serie e cambio.
  curiosita:
    - "Lo S63 delle X5 M e X6 M del 2009 è stato il primo motore BMW M con turbocompressori e con iniezione diretta."
    - "Il programma di assistenza N63 del 2014 non includeva le X5 M e X6 M con S63."

