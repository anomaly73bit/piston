    bielle forgiate e turbine con giranti in acciaio. Le unità da competizione superano i 1000 CV.
  curiosita:
    - "La potenza dichiarata di 280 CV rispettava l'accordo volontario tra i costruttori giapponesi; le misure al banco risultano spesso superiori."
    - "La pompa olio è trascinata direttamente dall'albero motore tramite un collare: sopra gli 8000 giri/min è il punto di rottura più frequente."

