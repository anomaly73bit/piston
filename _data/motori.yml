    - "Distribuzione dei primi motori: eliminati i fori di lubrificazione dal centro degli alberi a camme ai lobi, con usura di lobi e punterie a dito e molti interventi in garanzia"
    - "Correzioni successive con lobi, punterie e guide valvole più duri, molle più morbide e valvole a stelo maggiorato; molti preparatori ripristinano i passaggi d'olio"
    - "Sulla Cerbera numerosi motori dei primi anni hanno richiesto la ricostruzione"
  limiti: >-
    In aspirato la versione di serie più spinta arriva a 412 CV con 473 Nm (Sagaris). Il componente critico è la
    distribuzione a punterie a dito e la sua lubrificazione; non ci sono soglie documentate affidabili oltre la potenza
    di serie.
  curiosita:
    - "Le versioni 3,6 e 4,0 litri hanno lo stesso alesaggio di 96 mm e differiscono solo per la corsa, 83 e 92 mm."

