    V8 a 90° interamente in alluminio derivato dal Buick 215 del 1960, di cui Rover acquistò progetto e attrezzature nel 1965
    producendolo dal 1967. Mantiene la distribuzione ad aste con albero a camme centrale e due valvole per cilindro; il
    basamento in alluminio fuso in sabbia ha canne in ghisa inserite. L'alesaggio passa da 88,9 a 94 mm con il 3.9 del 1989,
