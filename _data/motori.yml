  curiosita:
    - "Il sistema Trionic misura la corrente di ionizzazione tra gli elettrodi della candela dopo ogni scintilla per rilevare detonazione e mancate accensioni senza un sensore di battito separato."
    - "La 9-3 Viggen usa il B235R da 230 CV, la stessa versione delle 9-5 Aero dello stesso periodo."

