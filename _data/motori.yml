    rotativa a controllo elettronico; dal 1996 turbo a geometria variabile; dal 2000 iniettore-pompa (Pumpe-Düse)
    con pressioni fino a 2050 bar. È stato tra i motori più prodotti del gruppo e ha contribuito alla diffusione
    del diesel sulle auto europee negli anni '90 e 2000.
  punti_deboli:
    - Usura dell'albero a camme sui PD (lobi che comandano gli iniettori-pompa)
    - Volano bimassa e turbo a geometria variabile bloccato da fuliggine
    - Valvola EGR e sensore flusso aria
  limiti: >-
    Le versioni Pumpe-Düse arrivano a circa 200 CV con iniettori maggiorati e frizione rinforzata.
  curiosita:
    - "Sono documentate unità oltre il milione di chilometri, soprattutto su taxi e veicoli commerciali."

