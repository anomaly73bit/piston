  curiosita:
    - "Della 850 T-5R, venduta come tale nel 1995 e poi in una seconda serie nel 1996, sono stati prodotti 6964 esemplari."
    - "La Focus RS500 è stata costruita a Saarlouis in 500 esemplari numerati dal maggio 2010."

