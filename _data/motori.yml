    - "Consumo d'olio elevato sul VQ35DE, che con livello basso danneggia le catene di distribuzione"
    - "Catalizzatori del VQ37VHR che si intasano per le alte temperature dei gas di scarico"
    - "Tendicatena e pattini delle catene di distribuzione rumorosi all'avviamento a freddo su unità ad alto chilometraggio"
  limiti: >-
    Sul VQ35DE con interni di serie i preparatori indicano come limite prudente circa 400 CV alla ruota. Il VQ37VHR ha albero
    motore e bielle forgiati e regge potenze superiori, ma con la sovralimentazione i punti critici restano pistoni, guarnizioni
    della testata e lubrificazione.
  curiosita:
    - "La famiglia VQ è rimasta nella lista Ward's 10 Best Engines per 14 anni consecutivi fino al 2008; il VQ35DE vi figura dal 2002 al 2007 e di nuovo nel 2016."
    - "Le versioni ibride del VQ35HR (Fuga Hybrid, Infiniti M35h, Q50 Hybrid) raggiungono 360 hp complessivi con un motore elettrico e batteria agli ioni di litio."

