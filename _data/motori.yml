    - "Perdita di liquido sotto il collettore di aspirazione che può passare inosservata e danneggiare la testata, soprattutto sulla MGF a motore centrale"
    - "Testata in lega LM25 trattata termicamente: un surriscaldamento può ricuocerla e renderla inutilizzabile"
