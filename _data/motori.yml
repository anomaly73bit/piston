    - "Teste 3V costruite fino a fine 2007: candele in due pezzi che si grippano e si spezzano allo smontaggio (TSB 08-7-6)"
    - "Collettore di aspirazione in materiale composito (2V dal 1996): crepe nel condotto del liquido di raffreddamento"
    - "Guarnizioni guida valvole sui motori fino al 1995: consumo d'olio e fumo"
  limiti: >-
    Mancano soglie documentate da fonti tecniche affidabili. Le versioni sovralimentate di fabbrica partono da basi più robuste
    (blocco in ghisa sulle Cobra 2003–2004 e GT500 2007–2010, organi interni forgiati sulla Ford GT); le 2V e 3V aspirate
    da autovettura e autocarro non sono progettate per aumenti consistenti di pressione nei cilindri.
  curiosita:
    - "La Koenigsegg CCR usava un 4.6 DOHC modificato, con alesaggio 94,6 mm, corsa 94 mm e compressore Rotrex, da 806 hp."
    - "Il 4.6 SOHC 2V da 264 CV fu montato anche su MG ZT 260 e Rover 75 V8 (2003–2005)."

