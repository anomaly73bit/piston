    1999 la versione per Range Rover adotta gestione Bosch Motronic e coppa strutturale.
  punti_deboli:
    - "Versioni ad alesaggio 94 mm (3.9, 4.0, 4.2, 4.6): incrinature della parete del cilindro dal lato più sottile della camicia d'acqua, con passaggio di liquido tra blocco e canna e perdita di refrigerante senza tracce esterne"
    - "Spostamento delle canne con sovrapressione dell'impianto di raffreddamento, spesso diagnosticato come guarnizione della testata; il rimedio è l'installazione di canne con battuta superiore"
    - "Usura degli alberi a camme e perdite d'olio dal coperchio della distribuzione"
