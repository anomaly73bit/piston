    Nella 992 Turbo e Turbo S la cilindrata sale a 3745 cc con alesaggio di 102 mm e turbocompressori a geometria variabile.
  punti_deboli:
    - "Turbocompressori della 991.2 3.0: guasti segnalati dai proprietari, attribuiti all'alimentazione dell'olio, senza una comunicazione ufficiale del costruttore"
    - "Motore relativamente recente: non risultano altri difetti ricorrenti documentati su larga scala"
  limiti: >-
    Indicativamente, sui 3,0 litri la sola rimappatura porta guadagni nell'ordine di 50–80 CV mantenendo i turbo di
    serie; oltre, i componenti critici sono turbocompressori, intercooler e frizioni del PDK.
  curiosita:
    - "I boxer 9A2 usano solo due alesaggi (91 e 102 mm) e due corse (76,4 e 81,5 mm), da cui Porsche ricava cinque cilindrate per 718 e 911."
    - "La 992.2 GTS T-Hybrid e la 992.2 Turbo S adottano un diverso 3,6 litri da 97 × 81 mm con assistenza elettrica, non compreso in questa scheda."

