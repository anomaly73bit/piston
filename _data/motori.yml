  modelli:
    - { nome: "Eunos Cosmo (JC)", anni: "1990–1995" }
  storia: >-
    Unico motore rotativo a tre rotori prodotto in serie da Mazda, montato solo sulla Eunos Cosmo da febbraio 1990 a
    settembre 1995. Deriva dal 13G a tre rotori impiegato nelle corse di durata sulla Mazda 757. La cilindrata di 1962
    cc è la somma del volume di una camera per ciascuno dei tre rotori (3 × 654 cc). La
    potenza dichiarata di 280 CV coincide con il limite dell'accordo di autoregolamentazione dei costruttori giapponesi.
  punti_deboli:
    - "Primi motori (numerazione 000–999 e A000–A999): problemi agli alloggiamenti e rotture dell'albero eccentrico, risolti da Mazda in garanzia"
    - "Tenute d'apice e laterali: la compressione va misurata su tutti e tre i rotori"
    - "Consumi elevati: 15–20 l/100 km nel ciclo misto"
  limiti: >-
    Con centralina aftermarket i turbo di serie arrivano a circa 1 bar di pressione e intorno ai 300 CV. Oltre servono
    turbo maggiorati e revisione completa con tenute nuove; le cifre più alte dichiarate dai preparatori vanno
    considerate con prudenza.
  curiosita:
    - "La Eunos Cosmo con sistema CCS è indicata come la prima auto di serie con navigatore GPS integrato, gestito da uno schermo a sfioramento."
    - "Il 13G a tre rotori, da cui deriva il 20B, ha corso alla 24 Ore di Le Mans sulla Mazda 757."

