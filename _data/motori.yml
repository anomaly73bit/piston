    SL 600 R129 nel 2001, sostituito dal M137 a tre valvole; AMG ne ha derivato versioni da 7,0 a 7,3 litri fornite
    anche alla Pagani per la Zonda.
  punti_deboli:
    - "Cablaggio motore e cavi delle farfalle elettroniche (ETA): isolamento degradato, con guasti alla centralina EGAS"
  limiti: >-
    Motore aspirato: senza modifiche interne gli aumenti di potenza sono contenuti. Le versioni AMG da 7,1 e 7,3 litri
    richiedono alesaggio e corsa specifici, quindi albero motore e canne diversi dal 6,0 litri di serie.
  curiosita:
    - "Dal M120 deriva il M297 della CLK GTR (1997); per le 25 vetture stradali dell'omologazione FIA la cilindrata fu portata a 6,9 litri."
    - "La SL 73 AMG da 7,3 litri e 525 CV fu prodotta in poche decine di esemplari."

