    - { valore: "1000+ CV", testo: "ottenuti sul basamento di serie con interni forgiati" }
    - { valore: "1997", testo: "arrivo della fasatura variabile VVT-i" }
  versioni:
    - { nome: "Aristo JZS147", anni: "1991–1997", cv: 280, nm: 431, nota: "Debutto del motore, turbo sequenziali" }
    - { nome: "Supra JZA80 JDM", anni: "1993–2002", cv: 280, nm: 451, nota: "Limitato dal 'gentlemen's agreement' giapponese; VVT-i dal 1997" }
    - { nome: "Supra JZA80 export", anni: "1993–1998", cv: 330, nm: 441, nota: "Turbine in acciaio, versione USA/Europa" }
