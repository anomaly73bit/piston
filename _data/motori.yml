    Hungaria a Győr. La seconda generazione EA897 (2010) mantiene alesaggio e corsa ma adotta un basamento in ghisa a grafite
    vermicolare più leggero di circa 8 kg; la versione biturbo usa due turbocompressori in serie, quello di alta pressione a
    geometria variabile, fino a 3,2 bar assoluti. Con l'evo del 2014 (272 CV, 192 kg) arrivano pompa olio a portata variabile
