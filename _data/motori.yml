  storia: >-
    Progettato per l'omologazione Gruppo A: la cilindrata di 2568 cc, moltiplicata per il coefficiente turbo 1,7,
    colloca la vettura nella classe fino a 4,5 litri. Basamento in ghisa, testata in alluminio bialbero a 24
    valvole, sei corpi farfallati singoli e due turbo in parallelo con giranti in ceramica. La R32 GT-R vinse
    tutte le 29 gare del campionato giapponese Gruppo A a cui partecipò tra il 1990 e il 1993.
  punti_deboli:
    - Collare di trascinamento della pompa olio, che si rompe soprattutto con limitatori alzati
    - Lubrificazione del treno valvole posteriore a regimi molto alti
    - Turbine con giranti in ceramica fragili oltre la pressione di serie
  limiti: >-
