    alla catena di distribuzione, abbassa la compressione a 15,6:1 e porta la pressione di iniezione a 220 MPa.
    Dal 2020 la versione aggiornata sale a 204 CV e dall'agosto 2023 è disponibile anche con sistema mild hybrid a 48 V.
    I dati tecnici principali della scheda si riferiscono al 1GD-FTV.
