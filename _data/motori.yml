    V6 a 60° interamente in alluminio con basamento pressofuso, bialbero a catena e doppia fasatura variabile, introdotto
    sulla Jeep Grand Cherokee del 2011 e poi esteso a quasi tutta la gamma Chrysler, Dodge, Jeep e Ram. Iniezione indiretta:
    l'iniezione diretta, la sovralimentazione e la disattivazione dei cilindri erano state previste ma non adottate in serie.
    L'evoluzione del 2016 porta la compressione a 11,3:1 e aggiunge alzata variabile a due stadi ed EGR raffreddato; dalla
    stessa famiglia derivano il 3.2 della Cherokee e il 3.0.
  punti_deboli:
