    V12 a 60° progettato da Giotto Bizzarrini per la 350 GTV del 1963, con basamento in alluminio e due alberi a
    camme per bancata comandati a catena. Dagli anni '80 la cilindrata cresce da 4754 cc (Countach LP500 S, 1982)
    a 5167 cc con testate a quattro valvole (Quattrovalvole, 1985), 5707 cc con iniezione elettronica (Diablo, 1990),
    poi 6,0, 6,2 litri a carter secco e 6496 cc (Murciélago LP640, 2006). L'ultima Murciélago esce da Sant'Agata il
    5 novembre 2010; il successore è il V12 L539 dell'Aventador. La cilindrata indicata è quella del 6,5 litri.
  punti_deboli:
    - "Countach: registrazione del gioco valvole ogni 15.000 miglia con rimozione dei carburatori"
    - "Countach: accensione elettronica Magneti Marelli soggetta a guasti; tubo olio tra radiatore e motore che si fessura"
    - "Diablo prima serie: tenditori idraulici delle catene di distribuzione che potevano tendere fino alla rottura (tenditori meccanici dal 1994 circa)"
    - "Diablo: perdite d'olio dal sigillante tra basamento e coppa; variatori di fase delle ultime versioni sensibili all'olio degradato"
    - "Murciélago: problemi alla fasatura con mancate accensioni e consumo d'olio fino a circa 1 litro ogni 1600 km"
  limiti: >-
    Motore aspirato: le versioni di serie arrivano a 670 CV con 6,5 litri e gli aumenti sono stati ottenuti con
    cilindrata e regime. Il componente critico è la distribuzione a catena, con tenditori e variatori di fase
    sensibili alla qualità e allo stato dell'olio.
  curiosita:
    - "La cilindrata passa dai 3,5 litri della 350 GTV ai 6496 cc della Murciélago LP640, quasi raddoppiando."
    - "Il V12 a quattro valvole del Countach Quattrovalvole equipaggia anche il fuoristrada LM002."

