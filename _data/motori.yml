    In un'epoca di turbo ed elettrificazione, Ferrari lo mantiene aspirato come simbolo del marchio.
    La cilindrata indicata è quella attuale (6496 cc).
  punti_deboli:
    - Pochissimi difetti strutturali noti; manutenzione molto costosa
  limiti: >-
    Non rilevante: già al limite dell'aspirato di serie (oltre 127 CV/litro sulla 812 Competizione).
  curiosita:
    - La Purosangue è il primo SUV con un V12 aspirato montato in posizione anteriore centrale.

