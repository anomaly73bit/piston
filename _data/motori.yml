    Lincoln Town Car del 1991. Il termine «Modular» indicava il processo produttivo con linee riconfigurabili, non
    l'intercambiabilità dei pezzi. Il 4.6 è quasi quadro (90,2 × 90,0 mm), il 5.4 del 1997 allunga la corsa a 105,8 mm;
    entrambi esistono in versione SOHC a 2 e 3 valvole e DOHC a 4 valvole, con blocco in ghisa o alluminio secondo l'impiego.
    Le varianti sovralimentate di fabbrica (Cobra 2003–2004, Ford GT, Shelby GT500) erano assemblate a mano nella linea SVT di Romeo.
  punti_deboli:
