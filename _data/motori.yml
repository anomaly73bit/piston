  curiosita:
    - "Gli iniettori del 1GD-FTV hanno un codice QR con la correzione di portata individuale, da programmare nella centralina alla sostituzione."
    - "Sul 1KD-FTV l'albero a camme di aspirazione è mosso dalla cinghia e comanda quello di scarico tramite ingranaggio."

