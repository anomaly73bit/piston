    (o cambio DSG). Le versioni evo hanno un post-trattamento più complesso che limita le modifiche.
  curiosita:
    - "Il primo dei due catalizzatori SCR dell'evo, da 3,4 litri, è montato subito dopo il motore e funziona anche da filtro antiparticolato; l'obiettivo dichiarato era 80 mg/km di NOx in prova RDE."
    - "Il 2.0 BiTDI della Passat B8 abbina due turbocompressori su un quattro cilindri di serie, con 500 Nm."

