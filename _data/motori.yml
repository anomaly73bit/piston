    - "Catena di distribuzione: allungamento e cedimento del tendicatena idraulico"
    - "Pompa acqua e frizione magnetica del compressore, montate sullo stesso gruppo: perdita di coppia in basso o surriscaldamento"
    - "Mancate accensioni da bobine e iniettori (lotti difettosi, iniettori modificati nel 2010) con dilavamento delle canne e danni a pistoni e segmenti"
    - "Consumo d'olio elevato su alcune unità, risolto in officina con segmenti nuovi"
  limiti: >-
    Indicativamente le versioni da 160–180 CV accettano una mappatura moderata; il componente critico sono i pistoni di
    serie, sensibili alla detonazione, seguiti dalla catena di distribuzione. Chi elabora il motore deve prima escludere
    mancate accensioni e consumo d'olio.
  curiosita:
    - "Ha vinto l'International Engine of the Year come miglior motore nuovo nel 2006 e la categoria 1,0–1,4 litri dal 2006 al 2011."
    - "Nel 2011 la stampa riportava che Volkswagen avrebbe abbandonato la doppia sovralimentazione perché troppo costosa da produrre su un motore di questa cilindrata."

