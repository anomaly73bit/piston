  storia: >-
    Quinta generazione del small-block Chevrolet, debutta con l'LT1 sulla Corvette C7 del 2014. Mantiene l'architettura di base
    dell'LS3 con aste e bilancieri e due valvole per cilindro, ma adotta un nuovo basamento, testate con condotti ridisegnati,
    iniezione diretta, fasatura variabile continua e disattivazione di quattro cilindri. Le versioni sovralimentate LT4 e LT5
    usano compressori volumetrici Eaton; l'LT5 introduce la doppia iniezione diretta e indiretta. L'LT2 della Corvette C8 a motore
    centrale ha lubrificazione a carter secco di serie.
