    - { nome: "Mazda 3 (BP)", anni: "2019–oggi" }
    - { nome: "Mazda CX-30", anni: "2019–oggi" }
  storia: >-
    Quattro cilindri 2.0 con combustione SPCCI (Spark Controlled Compression Ignition): una miscela molto magra
    iniettata in aspirazione viene accesa per compressione dall'aumento di pressione prodotto da una piccola carica
    più ricca accesa dalla candela. Un compressore volumetrico di tipo Roots fornisce l'eccesso d'aria richiesto
    dalla combustione magra. Debutta nel 2019 su Mazda3 e CX-30 e nel 2021 diventa e-Skyactiv X con 186 CV; non è
    mai stato offerto negli Stati Uniti. Una versione a sei cilindri 3.0 annunciata da Mazda non è entrata in produzione.
  punti_deboli:
    - "Motore poco diffuso: ricambi costosi e di reperibilità limitata"
    - "Depositi carboniosi sulle valvole di aspirazione, comuni ai motori a iniezione diretta"
  limiti: >-
    La combustione SPCCI dipende da un sensore di pressione in camera e da una calibrazione specifica: le
    elaborazioni sono rare e non esistono riferimenti affidabili. Il compressore serve a garantire l'eccesso d'aria
    della combustione magra più che ad aumentare la potenza specifica.
  curiosita:
    - "Con avviamento a freddo, riscaldamento e carichi molto alti il motore passa all'accensione comandata con miscela stechiometrica 14,7:1."
    - "L'aggiornamento del 2021 ha portato 6 CV e 16 Nm in più e una riduzione delle emissioni di CO2 fino a 10 g/km nel ciclo WLTP."

