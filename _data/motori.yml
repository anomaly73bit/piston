  storia: >-
    Primo motore progettato e costruito interamente da Lotus, quattro cilindri bialbero a 16 valvole con distribuzione a
    cinghia, basamento e testata in alluminio e canne in umido; debutta nel marzo 1972 sulla Jensen-Healey. Nel 1980 la
    corsa passa a 76,2 mm per il 2.2 (912 aspirato e 910 turbo); il 910 dell'Esprit Turbo ha supporti di banco integrati
    in un unico elemento, valvole di scarico al sodio, compressione 7,5:1 e turbo Garrett T3, con carter secco sostituito
    da un carter umido nel 1983. Dal 1989 adotta l'iniezione Delco e nel 1990, come 910S, uno scambiatore aria-acqua;
    il 920 da 2,0 litri a corsa lunga chiude la famiglia nel 1999.
  punti_deboli:
    - "Cinghia della distribuzione da sostituire ogni 24.000 miglia o due anni"
    - "Perdite d'olio dalla guarnizione dei coperchi degli alberi a camme sul collettore di scarico e nei pozzetti delle candele, con mancate accensioni in accelerazione"
    - "Guarnizione della testata danneggiata da surriscaldamento per guasto della ventola o radiatore ostruito; perdite dalla pompa dell'acqua"
    - "Wastegate del turbo che si blocca e collettori di scarico incrinati"
  limiti: >-
    La versione di serie più spinta è il 910S con testata Zeus, circa 300 hp a 1 bar di pressione. Non ci sono soglie
    documentate oltre questo livello; i componenti critici sono guarnizione della testata e raffreddamento.
  curiosita:
    - "Il 920 da 1994 cc fu creato per l'Italia, dove la fascia fiscale sotto i 2 litri rendeva svantaggioso il 2.2."
    - "Sul 910 il turbo soffia aria attraverso i carburatori, dotati di tenute a pressione sugli alberini delle farfalle."

