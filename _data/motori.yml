    - "Elettromagneti dei variatori di fase (M274): trafilamento d'olio nel cablaggio fino alla centralina"
    - "Alberi a camme con saldatura difettosa su motori del 2015 (C W205, E W212, GLC, SLK): rischio di rottura"
    - "Sensore NOx: guasti frequenti con codice P2200"
    - "Tenditore della catena di distribuzione: usura precoce della catena, rumorosità all'avviamento"
    - "Depositi carboniosi nel condotto di aspirazione e sulle valvole, tipici dell'iniezione diretta"
  limiti: >-
    Indicativamente le versioni da 245–258 CV raggiungono 280–300 CV con la sola centralina; il componente critico è il
    turbo di serie, insieme alla temperatura dell'aria aspirata.
  curiosita:
    - "Il M274 per Infiniti è stato prodotto dal giugno 2014 anche nello stabilimento Nissan di Decherd, nel Tennessee."

