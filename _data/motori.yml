  storia: >-
    V6 a 60° della famiglia VQ con basamento e testate in alluminio, bialbero a quattro valvole per cilindro e catene di
    distribuzione. Il VQ35DE debutta nel 2000 sulla Nissan Elgrand e viene montato su berline, SUV e sulla 350Z. Il VQ35HR
    del 2006 mantiene alesaggio e corsa ma ha basamento rialzato di 8,4 mm, bielle più lunghe e compressione 10,6:1. Il
    VQ37VHR del 2008 porta la corsa a 86 mm e introduce il sistema VVEL sulle valvole di aspirazione. La cilindrata indicata
