  alesaggio: 86.0
  corsa: 86.0
  compressione: "8.5:1"
  distribuzione: DOHC a cinghia (VVT-i dal 1997)
  valvole: 4
  blocco: Ghisa
  testa: Alluminio
  iniezione: Indiretta multipoint
  cv_min: 280
  cv_max: 330
  nm_max: 451
  limitatore: 6800
  versioni:
    - { nome: "Aristo JZS147", anni: "1991–1997", cv: 280, nm: 431, nota: "Debutto del motore, turbo sequenziali" }
    - { nome: "Supra JZA80 JDM", anni: "1993–2002", cv: 280, nm: 451, nota: "Limitato dal 'gentlemen's agreement' giapponese; VVT-i dal 1997" }
    - { nome: "Supra JZA80 export", anni: "1993–1998", cv: 330, nm: 441, nota: "Turbine in acciaio, versione USA/Europa" }
  modelli:
    - { nome: "Toyota Supra (A80)", anni: "1993–2002" }
    - { nome: "Toyota Aristo / Lexus GS (S140, S160)", anni: "1991–2004" }
  storia: >-
    Nato come evoluzione del 1JZ, il 2JZ-GTE debutta nel 1991 sull'Aristo e diventa leggenda con la Supra A80.
    Il blocco in ghisa a sei cilindri in linea, con alesaggio e corsa quadri e una robustezza sovradimensionata,
    è stato progettato per affidabilità e coppia, non per stare al limite. Proprio questo margine lo ha reso
    il riferimento assoluto del tuning giapponese a fine anni '90.
  punti_deboli:
    - Turbine sequenziali originali con tenute delicate dopo molti anni
    - Valvole di controllo del sistema sequenziale (tubazioni vuoto) soggette a guasti
    - Cinghia di distribuzione da sostituire regolarmente (motore non interferente sulle prime versioni)
  limiti: >-
    Basamento e albero di serie reggono oltre 700 CV; le bielle originali sono di solito considerate il limite
    intorno a 700–800 CV. Con interni forgiati si superano i 1000 CV sul blocco di serie.
  curiosita:
    - La versione VVT-i del 1997 aumenta la coppia ai medi regimi senza cambiare la potenza dichiarata.
    - Il film "Fast and Furious" (2001) ha contribuito a renderlo un'icona fuori dal Giappone.

