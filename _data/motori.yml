    catena di distribuzione, insieme alla turbina a geometria variabile e alla frizione con volano bimassa.
  curiosita:
    - "I motori Toyota 1WW (1,6 litri, 112 CV) e 2WW (2,0 litri, 143 CV) derivano direttamente dall'N47."
    - "Nel 2015 BMW ha avviato un richiamo per sostituire il tenditore della catena e, se usurata, la catena stessa."

