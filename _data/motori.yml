  punti_deboli:
    - "Surriscaldamento sui primi motori a carburatore"
    - "Cinghia di distribuzione con intervallo di circa 38.000 km (24.000 miglia)"
    - "Alberi a camme rumorosi per scarsa lubrificazione; possibile miscelazione di olio e liquido di raffreddamento"
    - "Trafilamenti d'olio nella parte posteriore del motore e pompa dell'acqua con gioco"
  limiti: >-
    Il 2.0 24v arriva di serie a 330 CV nella Ghibli Cup con turbine su cuscinetti a rulli e gestione elettronica
    rivista. Oltre questo livello i componenti critici sono turbocompressori e pistoni, forgiati solo dal 1991.
  curiosita:
    - "Con 330 CV da 1996 cc la Ghibli Cup aveva la potenza specifica più alta tra le auto stradali dell'epoca."
    - "La cilindrata di 2 litri delle versioni italiane rispondeva all'IVA maggiorata sulle auto oltre i 2000 cc."

