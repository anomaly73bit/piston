    - "Consumo d'olio per usura dei paraolio valvole"
  limiti: >-
    Con componenti interni di serie il limite indicato è intorno a 500–550 CV alla ruota, con turbo singolo maggiorato,
    iniettori e pompa benzina adeguati. Con i turbo di serie della prima serie, a giranti in ceramica, conviene
    mantenere pressioni di sovralimentazione contenute.
  curiosita:
    - "La potenza dichiarata di 280 CV rispetta l'accordo tra costruttori giapponesi che limitava le auto di serie a quella soglia."
    - "Nel passaggio al turbo singolo la potenza resta 280 CV, ma il regime di coppia massima scende da 4800 a 2400 giri/min."

