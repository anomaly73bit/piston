# =====================================================================
#  CILINDRATA — database motori 1980–oggi
#  Una voce per famiglia di motore. Campi:
#   slug, codice, nome, costruttore, paese, inizio, fine (vuoto = in produzione)
#   architettura, cilindri, alimentazione, aspirazione
#   cilindrata (cc), alesaggio / corsa (mm), compressione
#   distribuzione, valvole (per cilindro), blocco, testa, iniezione
#   cv_min, cv_max (CV/PS), nm_max, limitatore (giri/min)
#   versioni[], modelli[], storia, punti_deboli[], limiti, curiosita[]
#  I valori sono compilati da fonti pubbliche: verificare sempre
#  sui dati ufficiali del costruttore prima di usi tecnici.
# =====================================================================

