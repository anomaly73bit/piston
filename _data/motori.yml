    - { valore: "16,3:1", testo: "compressione della prima serie, ridotta a 15,0:1 sull'e-Skyactiv X" }
    - { valore: "24 V", testo: "sistema mild hybrid M Hybrid con starter-generatore a cinghia di serie" }
