    canne in umido. Nel luglio 1981 arrivano le testate HE progettate dallo svizzero Michael May, con camera di combustione
    ad alta turbolenza che consente rapporti di compressione elevati con miscela magra e riduce i consumi. Nel 1992 la corsa
