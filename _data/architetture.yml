- id: L3
  nome: Tre cilindri in linea
  testo: >-
    Compatto ed economico, tornato di moda con il downsizing turbo. Ha una vibrazione di primo ordine
    che richiede contralberi o supporti dedicati, ma pochi attriti interni.
- id: L4
  nome: Quattro cilindri in linea
  testo: >-
    L'architettura più diffusa al mondo: semplice, corta, economica da produrre. Le vibrazioni del secondo
    ordine crescono con la cilindrata, per questo oltre i 2,0–2,5 litri si usano spesso alberi di equilibratura.
- id: L5
  nome: Cinque cilindri in linea
  testo: >-
    Soluzione intermedia tra quattro e sei cilindri, usata soprattutto da Audi e Volvo. Accensione ogni 144°
    e coppia oscillante del primo ordine.
- id: L6
  nome: Sei cilindri in linea
  testo: >-
    Perfettamente equilibrato per natura, silenzioso e regolare. È lungo e difficile da montare trasversale,
    ma è tornato centrale con le piattaforme modulari BMW e Mercedes.
- id: V6
  nome: V6
  testo: >-
    Corto e adatto al montaggio trasversale. Gli angoli più comuni sono 60° e 90°; a seconda della configurazione
    richiede perni di biella sfalsati o contralberi.
- id: V8
  nome: V8
  testo: >-
    Con albero a croce (cross-plane) è equilibrato ma con accensione irregolare per bancata; con albero piatto
    (flat-plane) è più leggero e favorisce i regimi alti, a scapito di vibrazioni del secondo ordine.
- id: V10
  nome: V10
  testo: >-
    Diffuso in Formula 1 negli anni '90 e 2000 e su poche supercar di serie. Richiede perni di biella sfalsati
    per un'accensione regolare a 90°.
- id: V12
  nome: V12
  testo: >-
    Equilibrato in modo naturale su tutti gli ordini di vibrazione, con fasi di scoppio ogni 60°. Usato su granturismo e supercar di grande cilindrata.
- id: W16
  nome: W16
  testo: >-
    Due gruppi VR8 a stretto angolo affiancati su un unico albero motore. Usato in serie solo da Bugatti.
- id: Boxer 4
  nome: Boxer a quattro cilindri
  testo: >-
    Cilindri contrapposti, baricentro basso. Subaru lo usa da decenni; il suono caratteristico deriva dai
    collettori di scarico di lunghezza diversa.
- id: Boxer 6
  nome: Boxer a sei cilindri
  testo: >-
    Cilindri contrapposti, equilibrato in modo naturale, baricentro basso. Usato da Porsche sulla 911, montato a sbalzo dietro l'asse posteriore.
- id: Rotativo
  nome: Rotativo Wankel
  testo: >-
    Niente pistoni né valvole: un rotore triangolare gira in una camera epitrocoidale. Leggerissimo e molto
    compatto, ma con consumi e tenute difficili. In questo sito il numero di "cilindri" indica i rotori.
- id: Boxer 12
  nome: Dodici cilindri contrapposti
  testo: >-
    Due bancate di sei cilindri a 180° su un basamento molto basso, che abbassa il baricentro nelle vetture a motore centrale.
    Nelle realizzazioni Ferrari le bielle contrapposte condividono lo stesso perno di manovella, per cui tecnicamente è un V a 180° più che un boxer puro.
